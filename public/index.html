<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      /* Orb blob animations */
      @keyframes blob-1 {
        0%, 100% { transform: translate(10%, 15%) scale(1); }
        50%       { transform: translate(-8%, -12%) scale(1.15); }
      }
      @keyframes blob-2 {
        0%, 100% { transform: translate(-12%, -10%) scale(1); }
        50%       { transform: translate(10%, 12%) scale(0.88); }
      }
      @keyframes blob-3 {
        0%, 100% { transform: translate(-10%, 12%) scale(0.95); }
        50%       { transform: translate(12%, -10%) scale(1.1); }
      }
      @keyframes orb-breathe {
        0%, 100% { transform: scale(1); }
        50%       { transform: scale(1.04); }
      }
      @keyframes glow-idle {
        0%, 100% { opacity: 0.2; }
        50%       { opacity: 0.35; }
      }

      /* Idle state */
      #orb-wrapper { animation: orb-breathe 4s ease-in-out infinite; }
      #orb-glow    { animation: glow-idle 4s ease-in-out infinite; }
      #blob-1 { animation: blob-1 7s ease-in-out infinite; }
      #blob-2 { animation: blob-2 8s ease-in-out infinite; }
      #blob-3 { animation: blob-3 6s ease-in-out infinite; }

      /* Recording state — override animation durations only; scale driven by JS */
      #orb-wrapper.recording #blob-1 { animation-duration: 2.5s; }
      #orb-wrapper.recording #blob-2 { animation-duration: 3s; }
      #orb-wrapper.recording #blob-3 { animation-duration: 2s; }
      #orb-wrapper.recording #orb-glow { animation-duration: 1.5s; }

      /* Transcript panel scrollbar */
      #transcript-panel::-webkit-scrollbar { width: 4px; }
      #transcript-panel::-webkit-scrollbar-track { background: transparent; }
      #transcript-panel::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }

      /* Assistant panel scrollbar */
      #assistant-panel::-webkit-scrollbar { width: 4px; }
      #assistant-panel::-webkit-scrollbar-track { background: transparent; }
      #assistant-panel::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }
    </style>
  </head>

  <body class="min-h-screen bg-zinc-950 text-white flex flex-col items-center">

    <!-- ── Header ───────────────────────────────────────────── -->
    <header class="flex flex-col items-center gap-3 pt-10 pb-4">
      <p class="text-xs font-semibold tracking-widest uppercase text-zinc-600">AI Assistant</p>
      <span id="status"
        class="text-xs px-3 py-1 rounded-full border border-zinc-700 bg-zinc-900 text-zinc-500 transition-colors duration-300">
        Desconectado
      </span>
    </header>

    <!-- ── Orb ──────────────────────────────────────────────── -->
    <main class="flex flex-1 items-center justify-center w-full py-6">
      <div id="orb-wrapper" class="relative w-52 h-52 select-none">

        <!-- Outer glow (audio-reactive via JS opacity) -->
        <div id="orb-glow"
          class="absolute -inset-10 rounded-full bg-indigo-500 blur-3xl pointer-events-none">
        </div>

        <!-- Orb core -->
        <div class="relative w-full h-full rounded-full overflow-hidden shadow-2xl">
          <!-- Base gradient -->
          <div class="absolute inset-0 bg-gradient-to-br from-indigo-700 via-violet-700 to-purple-800"></div>

          <!-- Blob 1 — blue -->
          <div id="blob-1"
            class="absolute w-4/5 h-4/5 -top-1/4 -left-1/4 rounded-full bg-gradient-to-br from-sky-400 to-indigo-500 opacity-60 blur-2xl">
          </div>

          <!-- Blob 2 — purple/pink -->
          <div id="blob-2"
            class="absolute w-3/4 h-3/4 top-1/4 left-1/4 rounded-full bg-gradient-to-tl from-fuchsia-400 to-violet-500 opacity-50 blur-2xl">
          </div>

          <!-- Blob 3 — teal -->
          <div id="blob-3"
            class="absolute w-1/2 h-1/2 -bottom-1/4 -right-1/4 rounded-full bg-gradient-to-tl from-teal-400 to-cyan-400 opacity-55 blur-xl">
          </div>

          <!-- Specular highlight -->
          <div class="absolute top-5 left-9 w-12 h-7 rounded-full bg-white opacity-20 blur-md -rotate-12 pointer-events-none"></div>
        </div>

      </div>
    </main>

    <!-- ── Controls ─────────────────────────────────────────── -->
    <div class="flex gap-3 pb-6">
      <button id="start"
        class="px-7 py-2.5 rounded-full bg-white text-zinc-900 text-sm font-semibold transition-all hover:bg-zinc-100 active:scale-95">
        Iniciar
      </button>
      <button id="stop" disabled
        class="px-7 py-2.5 rounded-full text-sm font-semibold transition-all border border-zinc-700 bg-zinc-900 text-zinc-500 cursor-not-allowed opacity-50">
        Detener
      </button>
    </div>

    <!-- ── Panels ───────────────────────────────────────────── -->
    <footer class="w-full max-w-xl px-6 pb-10 flex flex-col gap-6">

      <!-- Transcription panel -->
      <div>
        <div class="mb-2 flex items-center gap-2">
          <div id="rec-dot" class="w-1.5 h-1.5 rounded-full bg-zinc-700 transition-colors duration-300"></div>
          <span class="text-xs text-zinc-600 font-medium tracking-wide uppercase">Transcripción</span>
        </div>
        <div id="transcript-panel"
          class="w-full h-40 rounded-2xl bg-zinc-900 border border-zinc-800 px-5 py-4 overflow-y-auto flex flex-col gap-1.5">
          <p id="placeholder" class="text-zinc-600 text-sm text-center m-auto">
            La transcripción aparecerá aquí…
          </p>
        </div>
      </div>

      <!-- Assistant panel -->
      <div id="assistant-section">
        <div class="mb-2 flex items-center gap-2">
          <div class="w-1.5 h-1.5 rounded-full bg-indigo-500"></div>
          <span class="text-xs text-zinc-600 font-medium tracking-wide uppercase">Asistente</span>
        </div>
        <div id="assistant-panel"
          class="w-full h-40 rounded-2xl bg-zinc-900 border border-zinc-800 px-5 py-4 overflow-y-auto flex flex-col gap-1.5">
          <p id="assistant-placeholder" class="text-zinc-600 text-sm text-center m-auto">
            La respuesta del asistente aparecerá aquí…
          </p>
        </div>
      </div>

    </footer>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      // ── Elements ──────────────────────────────────────────
      const statusEl          = document.getElementById('status');
      const startBtn          = document.getElementById('start');
      const stopBtn           = document.getElementById('stop');
      const orbWrapper        = document.getElementById('orb-wrapper');
      const orbGlow           = document.getElementById('orb-glow');
      const transcriptEl      = document.getElementById('transcript-panel');
      const placeholder       = document.getElementById('placeholder');
      const recDot            = document.getElementById('rec-dot');
      const assistantEl       = document.getElementById('assistant-panel');
      const assistantPlaceholder = document.getElementById('assistant-placeholder');

      // ── State ─────────────────────────────────────────────
      let mediaRecorder   = null;
      let stream          = null;
      let audioContext    = null;
      let analyser        = null;
      let animationId     = null;
      const finals        = [];   // confirmed transcript segments
      let interim         = '';   // current interim
      const responses     = [];   // assistant response messages

      // ── Audio-reactive orb ────────────────────────────────
      function startAudioAnalysis(src) {
        audioContext = new AudioContext();
        analyser     = audioContext.createAnalyser();
        analyser.fftSize = 32;
        audioContext.createMediaStreamSource(src).connect(analyser);

        const buf = new Uint8Array(analyser.frequencyBinCount);

        function tick() {
          analyser.getByteFrequencyData(buf);
          const avg   = buf.reduce((s, v) => s + v, 0) / buf.length;
          const level = Math.min(avg / 90, 1);          // 0–1

          orbWrapper.style.transform = `scale(${1 + level * 0.38})`;
          orbGlow.style.opacity      = (0.2 + level * 0.55).toFixed(2);

          animationId = requestAnimationFrame(tick);
        }
        tick();
      }

      function stopAudioAnalysis() {
        if (animationId)   { cancelAnimationFrame(animationId); animationId = null; }
        if (audioContext)  { audioContext.close(); audioContext = null; }
        orbWrapper.style.transform = '';
        orbGlow.style.opacity      = '';
      }

      // ── Transcript rendering ──────────────────────────────
      function renderTranscripts() {
        placeholder.remove();

        // Rebuild children
        transcriptEl.innerHTML = '';
        finals.forEach((text) => {
          const p = document.createElement('p');
          p.className = 'text-white text-sm leading-relaxed';
          p.textContent = text;
          transcriptEl.appendChild(p);
        });

        if (interim) {
          const p = document.createElement('p');
          p.className = 'text-zinc-400 text-sm leading-relaxed';
          p.textContent = interim + '…';
          transcriptEl.appendChild(p);
        }

        transcriptEl.scrollTop = transcriptEl.scrollHeight;
      }

      // ── Status helpers ───────────────────────────────────
      function setStatus(text, colorClass) {
        statusEl.textContent = text;
        statusEl.className =
          `text-xs px-3 py-1 rounded-full border transition-colors duration-300 ${colorClass}`;
      }

      function setRecording(active) {
        orbWrapper.classList.toggle('recording', active);
        recDot.className = active
          ? 'w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse transition-colors duration-300'
          : 'w-1.5 h-1.5 rounded-full bg-zinc-700 transition-colors duration-300';
      }

      // ── Assistant panel rendering ─────────────────────────
      function renderAssistant() {
        if (assistantPlaceholder) assistantPlaceholder.remove();
        assistantEl.innerHTML = '';
        responses.forEach((text) => {
          const p = document.createElement('p');
          p.className = 'text-indigo-300 text-sm leading-relaxed';
          p.textContent = text;
          assistantEl.appendChild(p);
        });
        assistantEl.scrollTop = assistantEl.scrollHeight;
      }

      // ── Socket.io ─────────────────────────────────────────
      const socket = io();

      socket.on('connect', () => {
        setStatus('Conectado', 'border-emerald-500/40 bg-emerald-950/30 text-emerald-400');
      });

      socket.on('disconnect', () => {
        setStatus('Desconectado', 'border-zinc-700 bg-zinc-900 text-zinc-500');
        setRecording(false);
        stopAudioAnalysis();
      });

      socket.on('audio-stream:error', (err) => {
        setStatus('Error del servidor', 'border-amber-500/40 bg-amber-950/30 text-amber-400');
        console.error('audio-stream:error', err);
      });

      socket.on('assistant:response', ({ text }) => {
        responses.push(text);
        if (responses.length > 10) responses.shift();
        renderAssistant();
      });

      socket.on('assistant:audio', (audioData) => {
        const ctx = new AudioContext();
        const buffer = audioData instanceof ArrayBuffer
          ? audioData
          : (audioData.buffer ?? audioData);
        ctx.decodeAudioData(buffer, (decoded) => {
          const src = ctx.createBufferSource();
          src.buffer = decoded;
          src.connect(ctx.destination);
          src.start();
        }, (err) => {
          console.error('Error decoding assistant audio:', err);
        });
      });

      socket.on('transcription', ({ transcript, isFinal }) => {
        if (isFinal) {
          if (transcript.trim()) finals.push(transcript.trim());
          if (finals.length > 10) finals.shift();
          interim = '';
        } else {
          interim = transcript;
        }
        renderTranscripts();
      });

      // ── Controls ──────────────────────────────────────────
      startBtn.addEventListener('click', async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });

          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.addEventListener('dataavailable', (e) => {
            if (e.data.size > 0 && socket.connected) {
              socket.emit('audio-stream', e.data);
            }
          });

          mediaRecorder.start(250);

          startAudioAnalysis(stream);
          setRecording(true);
          setStatus('Escuchando', 'border-indigo-500/40 bg-indigo-950/30 text-indigo-400');

          startBtn.disabled = true;
          startBtn.classList.add('opacity-40', 'cursor-not-allowed');
          stopBtn.disabled  = false;
          stopBtn.className =
            'px-7 py-2.5 rounded-full text-sm font-semibold transition-all bg-red-500 text-white hover:bg-red-600 active:scale-95';
        } catch (err) {
          setStatus('Sin micrófono', 'border-amber-500/40 bg-amber-950/30 text-amber-400');
          console.error(err);
        }
      });

      stopBtn.addEventListener('click', () => {
        if (mediaRecorder?.state !== 'inactive') mediaRecorder.stop();
        stream?.getTracks().forEach((t) => t.stop());

        stopAudioAnalysis();
        setRecording(false);
        setStatus('Conectado', 'border-emerald-500/40 bg-emerald-950/30 text-emerald-400');

        startBtn.disabled = false;
        startBtn.classList.remove('opacity-40', 'cursor-not-allowed');
        stopBtn.disabled  = true;
        stopBtn.className =
          'px-7 py-2.5 rounded-full text-sm font-semibold transition-all border border-zinc-700 bg-zinc-900 text-zinc-500 cursor-not-allowed opacity-50';
      });
    </script>
  </body>
</html>
