<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Stream</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0f0f0f;
        color: #f0f0f0;
        gap: 24px;
      }

      h1 {
        font-size: 1.4rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #a0a0a0;
      }

      #status {
        font-size: 0.85rem;
        padding: 6px 14px;
        border-radius: 999px;
        background: #1e1e1e;
        border: 1px solid #333;
        color: #888;
        transition: all 0.2s;
      }

      #status.connected {
        border-color: #22c55e;
        color: #22c55e;
      }

      #status.recording {
        border-color: #ef4444;
        color: #ef4444;
        animation: pulse 1.2s ease-in-out infinite;
      }

      #status.error {
        border-color: #f59e0b;
        color: #f59e0b;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .controls {
        display: flex;
        gap: 12px;
      }

      button {
        padding: 10px 28px;
        border-radius: 8px;
        border: none;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
      }

      button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      button:not(:disabled):active {
        transform: scale(0.97);
      }

      #start {
        background: #22c55e;
        color: #000;
      }

      #stop {
        background: #ef4444;
        color: #fff;
      }

      #log {
        width: 380px;
        max-height: 180px;
        overflow-y: auto;
        font-size: 0.75rem;
        font-family: monospace;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 10px 12px;
        color: #666;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      #log .entry { color: #888; }
      #log .entry.ok { color: #22c55e; }
      #log .entry.err { color: #ef4444; }
    </style>
  </head>
  <body>
    <h1>Audio Stream</h1>

    <span id="status">Desconectado</span>

    <div class="controls">
      <button id="start">Iniciar</button>
      <button id="stop" disabled>Detener</button>
    </div>

    <div id="log"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('start');
      const stopBtn = document.getElementById('stop');
      const logEl = document.getElementById('log');

      let mediaRecorder = null;
      let stream = null;
      let chunkCount = 0;

      function log(msg, type = '') {
        const el = document.createElement('div');
        el.className = `entry ${type}`;
        el.textContent = `${new Date().toLocaleTimeString()} ${msg}`;
        logEl.prepend(el);
      }

      // ── Socket.io ──────────────────────────────────────────────
      const socket = io();

      socket.on('connect', () => {
        statusEl.textContent = 'Conectado';
        statusEl.className = 'connected';
        log(`Conectado — ${socket.id}`, 'ok');
      });

      socket.on('disconnect', (reason) => {
        statusEl.textContent = 'Desconectado';
        statusEl.className = '';
        log(`Desconectado — ${reason}`, 'err');
      });

      socket.on('audio-stream:error', (error) => {
        log(`Error del servidor: ${JSON.stringify(error)}`, 'err');
      });

      // ── Controles ──────────────────────────────────────────────
      startBtn.addEventListener('click', async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });

          mediaRecorder = new MediaRecorder(stream);
          chunkCount = 0;

          mediaRecorder.addEventListener('dataavailable', (event) => {
            if (event.data.size > 0 && socket.connected) {
              socket.emit('audio-stream', event.data);
              chunkCount++;
              log(`Chunk #${chunkCount} enviado — ${event.data.size} bytes`);
            }
          });

          mediaRecorder.start(250); // chunk cada 250ms

          startBtn.disabled = true;
          stopBtn.disabled = false;
          statusEl.textContent = 'Grabando';
          statusEl.className = 'recording';
          log('Grabación iniciada', 'ok');
        } catch (err) {
          statusEl.textContent = 'Error';
          statusEl.className = 'error';
          log(`Micrófono: ${err.message}`, 'err');
        }
      });

      stopBtn.addEventListener('click', () => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }

        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusEl.textContent = 'Conectado';
        statusEl.className = 'connected';
        log(`Grabación detenida — ${chunkCount} chunks enviados`, 'ok');
        chunkCount = 0;
      });
    </script>
  </body>
</html>
